[package]
name = "soul-osx"
version = "0.1.0"
description = "soulOSX — Der Kortex. Live-Cockpit für die Soul-Engine."
authors = ["ProjectSoul"]
edition = "2021"

[lib]
name = "soul_osx_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
